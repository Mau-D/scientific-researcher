<mat-card class="min-w-1/3 p-2.5" appearance="outlined">
  <mat-card-header class="flex flex-col justify-center items-start p-2.5 my-2">
    <!-- <mat-card-subtitle class="text-gray-blue text-xxs">#{{dataId()}}</mat-card-subtitle> -->
    <p class="text-gray-blue text-[9px]">#{{dataId()}}</p>
    <mat-card-title class="text-gray-blue"
      >{{data()?.display_name}}</mat-card-title
    >
  </mat-card-header>
  <mat-divider class="p-3"></mat-divider>

  <!-- <img mat-card-image src="https://material.angular.dev/assets/img/examples/shiba2.jpg" alt="Photo of a Shiba Inu"> -->
  <mat-card-content>
    <div class="flex justify-between flex-wrap p-1">
      <div class="flex justify-start items-center w-1/3">
        <span
          class="dark:text-white text-gray-light text-2xl mr-1 h-auto flex justify-center items-center"
        >
          <mat-icon fontSet="material-symbols-outlined"
            ><span class="material-symbols-outlined">
              calendar_month
            </span></mat-icon
          >
        </span>
        <p class="text-gray-blue text-xs">
          <span class="text-gray-light">Publié: </span
          >{{data()?.publication_date}}
        </p>
      </div>
      <div class="flex justify-start items-center w-1/3">
        <span
          class="dark:text-white text-gray-light text-2xl mr-1 h-auto flex justify-center items-center"
        >
          <mat-icon fontSet="material-symbols-outlined"
            ><span class="material-symbols-outlined">
              <span class="material-symbols-outlined"> chat_bubble </span>
            </span></mat-icon
          >
        </span>
        <p class="text-gray-blue text-xs">
          <span class="text-gray-light">Langue: </span>{{data()?.language}}
        </p>
      </div>
      <div class="flex justify-start items-center w-1/3">
        <span
          class="dark:text-white text-gray-light text-2xl mr-1 h-auto flex justify-center items-center"
        >
          <mat-icon fontSet="material-symbols-outlined"
            ><span class="material-symbols-outlined">
              <span class="material-symbols-outlined">article</span>
            </span></mat-icon
          >
        </span>
        <p class="text-gray-blue text-xs">
          <span class="text-gray-light">Type: </span>{{data()?.type}}
        </p>
      </div>
    </div>
  </mat-card-content>
  <mat-card-actions>
    <button matButton>LIKE</button>
    <button matButton>SHARE</button>
  </mat-card-actions>
</mat-card>
