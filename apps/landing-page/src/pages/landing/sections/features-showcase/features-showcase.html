<section class="container mx-auto p-5 flex justify-between w-full flex-wrap">
  @for (item of showcaseItems; track item.title) {
  <div
    class="px-2.5 mb-2.5 gap-5 py-4 flex justify-between w-[24%] border-2 border-gray-300 rounded-lg"
  >
    <span class="text-gray-500 text-4xl h-auto">
      <mat-icon fontSet="material-symbols-outlined">{{item.icon}}</mat-icon>
    </span>
    <!-- <mat-icon class="h-auto w-full" svgIcon="thumbs-up" aria-hidden="false" aria-label="Example thumbs up SVG icon"></mat-icon> -->
    <!-- https://fonts.google.com/icons?hl=fr -->

    <div class="flex flex-col pl-1 justify-between">
      <div>
        <h2 class="text-2xl font-semibold text-gray-600">{{item.title}}</h2>
        <p class="text-gray-500 mb-5">{{item.text}}</p>
      </div>

      <lib-muted-button></lib-muted-button>
    </div>
  </div>
  }
</section>
