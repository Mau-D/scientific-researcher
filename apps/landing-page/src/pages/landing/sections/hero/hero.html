<section
  class="relative mx-auto flex flex-col items-end justify-end w-full min-h-screen h-full"
>
<!-- TODO:Optimiser les cas de l'utilisation de vidéo en bkg, ne fonstionne pas toujours -->
  <video
    [playbackRate]="0.3"
    class="absolute -z-10 object-cover w-full h-full"
    src="assets/ui/videos/6544570_Microscopic Biology Germs Microbes_By_Benedikt_Pleyer_Artlist_HD.mp4"
    autoplay
    loop
    muted
    playsinline
    preload="auto"
  ></video>
  <div class="min-h-full w-full absolute -z-1 bg-white/75 dark:bg-black/75"></div>
  <div class="container text-center lg:text-left flex flex-col mx-auto mb-20 mt-40 lg:mt-20 max-w-[800px] gap-10 px-5 lg:px-0">
    <p class="text-5xl lg:text-7xl font-semibold">Scientific-Researcher</p>
    <h1 class="text-xl lg:text-3xl text-shadow-neutral-800">
      <span class="font-bold">Automatisation, clarté et précision.</span>
      Scientific Researcher automatise la récupération de documentation API et
      t’offre une suite complète d’outils pour filtrer, explorer, analyser et
      traduire les contenus techniques avec exactitude.
    </h1>
    <button
      class="text-xl mx-auto bg-orange-500 text-white px-14 py-4 rounded-lg hover:bg-black duration-500 cursor-pointer"
    >
      Abonnez-vous
    </button>
  </div>
  <div class="container flex mx-auto items-end px-5 lg:px-0">
    <app-features-showcase></app-features-showcase>
  </div>
</section>
