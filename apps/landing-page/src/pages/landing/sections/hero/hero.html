<section
  class="relative mx-auto z-10 flex flex-col justify-around w-full min-h-screen h-full"
>
  <video
    [playbackRate]="0.3"
    class="absolute -z-10 object-cover w-full h-full"
    src="assets/ui/videos/6544570_Microscopic Biology Germs Microbes_By_Benedikt_Pleyer_Artlist_HD.mp4"
    autoplay
    loop
    muted
    playsinline
    preload="auto"
  ></video>
  <div class="min-h-full w-full absolute -z-1 bg-white/75"></div>
  <div class="container flex flex-col mx-auto mb-10 mt-20 max-w-[800px] gap-10">
    <p class="text-7xl font-semibold">Scientific-Researcher</p>
    <h1 class="text-3xl text-shadow-neutral-800">
      <span class="font-bold">Automatisation, clarté et précision.</span>
      Scientific Researcher automatise la récupération de documentation API et
      t’offre une suite complète d’outils pour filtrer, explorer, analyser et
      traduire les contenus techniques avec exactitude.
    </h1>
    <button
      class="text-xl mx-auto bg-orange-500 text-white px-14 py-4 rounded-lg hover:bg-black duration-500 cursor-pointer"
    >
      Abonnez-vous
    </button>
  </div>
  <app-features-showcase></app-features-showcase>
</section>
