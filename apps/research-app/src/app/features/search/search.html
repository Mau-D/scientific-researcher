<section class="flex flex-col justify-start items-center h-auto w-full">
  <div>
    <app-search-input
      (queryChange)="researchKeywords($event)"
      (selectChange)="onSelect($event)"
      [loading]="searchLoading()"
      [search]="search()"
      [suggestions]="keywords()"
    ></app-search-input>
  </div>
  @if (searchSelected()) {
  <div>
    <h1 class="text-2xl mb-4">
      Nombre de publications correspondantes : {{countWorks()}}
    </h1>
  </div>
  <div class="mb-5">
    <div class="mt-3">
      <mat-expansion-panel>
        <mat-expansion-panel-header class="flex justify-start items-center">
          <mat-panel-title>
            <span
              class="dark:text-white text-gray-light text-2xl mr-1 h-auto flex justify-center items-center hover:text-primary"
            >
              <mat-icon fontSet="material-symbols-outlined">
                filter_list
              </mat-icon>
            </span>
            <p>Filtres par défaut</p>
          </mat-panel-title>
        </mat-expansion-panel-header>
        <app-filters></app-filters>
      </mat-expansion-panel>
    </div>
    <div class="mt-3">
      <mat-expansion-panel expanded>
        <mat-expansion-panel-header class="flex justify-start items-center">
          <mat-panel-title>
            <span
              class="dark:text-white text-gray-light text-2xl mr-1 h-auto flex justify-center items-center hover:text-primary"
            >
              <mat-icon fontSet="material-symbols-outlined">
                filter_list
              </mat-icon>
            </span>
            <p>Filtrer par domaine</p>
          </mat-panel-title>
        </mat-expansion-panel-header>
        <app-domain-type-filters
          [data]="domainsDisplayed()"
          [unselectedList]="unselectedDomains()"
          (toggleChip)="toggleDomain($event)"
          [selectedState]="isDomainSelected()"
          [disabledState]="isDomainDisabled()"
        ></app-domain-type-filters>
      </mat-expansion-panel>
    </div>
    <div class="mt-3">
      <mat-expansion-panel expanded>
        <mat-expansion-panel-header class="flex justify-start items-center">
          <mat-panel-title>
            <span
              class="dark:text-white text-gray-light text-2xl mr-1 h-auto flex justify-center items-center hover:text-primary"
            >
              <mat-icon fontSet="material-symbols-outlined">
                filter_list
              </mat-icon>
            </span>
            <p>Filtrer par type</p>
          </mat-panel-title>
        </mat-expansion-panel-header>
        <app-domain-type-filters
          [data]="typesDisplayed()"
          [unselectedList]="unselectedTypes()"
          (toggleChip)="toggleType($event)"
          [selectedState]="isTypeSelected()"
          [disabledState]="isTypeDisabled()"
        ></app-domain-type-filters>
      </mat-expansion-panel>
    </div>
  </div>
  }
  <div>
    <button
      class="bg-blue-500 p-4 my-4 disabled:hidden"
      (click)="displayWorks(1)"
      [disabled]="!searchSelected()"
    >
      Afficher les résultats
    </button>
    <div><h1>{{worksResult.value()?.meta?.count}}</h1></div>
  </div>
  <div class="w-full">
    <mat-drawer-container class="w-full h-dvh">
      <mat-drawer
        #drawer
        mode="over"
        autoFocus="first-heading"
        position="end"
        class="h-full min-h-dvh min-w-[80dvw] py-5 px-10 flex flex-col justify-baseline items-baseline"
      >
        <div
          class="text-left text-2xl py-2 flex justify-between items-baseline"
        >
          <h2>Détails de la publication #{{idClicked()}}</h2>
          <!-- close button -->
          <span
            class="dark:text-white text-gray-light cursor-pointer text-2xl mr-1 h-auto flex justify-center items-center hover:text-primary"
          >
            <mat-icon
              fontSet="material-symbols-outlined"
              (click)="closeDrawer()"
            >
              close
            </mat-icon>
          </span>
        </div>
        <div>
          <app-work-details [data]="data.value()"></app-work-details>
        </div>
      </mat-drawer>
      <mat-drawer-content class="h-full overflow-auto">
        @if(worksResult){
        <app-results
          [worksResult]="worksResult.value()?.results ?? []"
          [isLoading]="worksLoading()"
          [error]="worksError()"
          (clickedForDetails)="onOpenDetails($event)"
        ></app-results>
        }
      </mat-drawer-content>
    </mat-drawer-container>
  </div>
</section>
